<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOMMA | Documentos de Campo</title>
  <meta name="description" content="Documentos de campo de F1 Services & Solutions.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="F1+ SOMMA" width="40" height="40">
        <span class="brand-text">
          <strong>SOMMA</strong>
          <small>Acreditación de contratistas</small>
        </span>
      </a>
      <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="toplinks" aria-label="Enlaces generales">
        <a href="index.html">Inicio</a>
        <a href="index.html#avisos">Avisos</a>
        <a href="index.html#contacto">Contáctenos</a>
      </nav>
    </div>
    <nav class="tabsbar" id="menu" aria-label="Menú principal">
      <a href="index.html" class="tab">Inicio</a>
      <a href="generar-listado.html" class="tab">Generar listado</a>
      <a href="ingreso-datos.html" class="tab">Ingreso de datos</a>
      <a href="#" class="tab">Auditorías</a>
      <a href="documentos-campo.html" class="tab active" aria-current="page">Documentos de Campo</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div class="title-row">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <h1>Documentos de Campo</h1>
      </div>
    </div>

    <form class="card form-card" id="form-campo" novalidate>
      <section class="form-section" aria-labelledby="sec-actividad">
        <h2 id="sec-actividad">Datos de la actividad</h2>
        <div class="form-grid">
          <div class="field span-2">
            <label for="actividad">Actividad <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="actividad" name="actividad" autocomplete="off" required>
            <p class="field-error" role="alert"></p>
          </div>
          <div class="field span-2">
            <label for="site">Site <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="site" name="site" autocomplete="off" required>
            <p class="field-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="fecha">Fecha <span class="req" aria-hidden="true">*</span></label>
            <input type="date" id="fecha" name="fecha" required>
            <p class="field-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="alto-riesgo">Trabajo de alto riesgo <span class="req" aria-hidden="true">*</span></label>
            <select id="alto-riesgo" name="altoRiesgo" required>
              <option value="">Elige una opción...</option>
              <option value="si">Sí</option>
              <option value="no">No</option>
            </select>
            <p class="field-error" role="alert"></p>
          </div>
        </div>
      </section>

      <section class="form-section" id="sec-docs" aria-labelledby="sec-docs-titulo" hidden>
        <h2 id="sec-docs-titulo">Documentos a anexar</h2>
        <p class="muted small docs-ayuda">Formato PDF o imagen (JPG, PNG, WEBP). Máximo 10 MB por archivo.</p>
        <div class="form-grid" id="docs-lista"></div>
      </section>

      <div class="form-actions">
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        <button type="reset" class="btn-ghost">Limpiar</button>
        <button type="submit" class="btn-primary">Guardar documentos</button>
      </div>
    </form>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> F1 Services &amp; Solutions · SOMMA</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/campo.js"></script>
</body>
</html>
